### Stage-1 training config: frozen W2V-BERT 2.0 frontend + MHFA backend.
### Ported from the original recipe with two changes:
###   - frontend key renamed w2vbert -> w2vbert_sv (upstream 'w2vbert' is the
###     LoRA-adapter variant with a different constructor)
###   - path_or_url made absolute
### Data args (train_data/train_label/noise_data/reverb_data) are passed on
### the command line as usual. NOTE: this repo reads raw wavs from disk; the
### original recipe's train_lmdb (raw audio from LMDB) is not ported.

exp_dir: exp/v2_w2vbert_sv/stage1_frozen
gpus: "[0,1,2,3,4,5,6,7]"
num_avg: 2
enable_amp: True # whether enable automatic mixed precision training
do_lm: False

seed: 716
num_epochs: 15
save_epoch_interval: 1 # save model every epoch
log_batch_interval: 100 # log every 100 batchs

dataloader_args:
  batch_size: 128
  num_workers: 8
  pin_memory: False
  prefetch_factor: 8
  drop_last: True

dataset_args:
  # the sample number which will be traversed within one epoch, if the value equals to 0,
  # the utterance number in the dataset will be used as the sample_num_per_epoch.
  sample_num_per_epoch: 0
  shuffle: True
  shuffle_args:
    shuffle_size: 2500
  filter: True
  filter_args:
    min_num_frames: 50
    max_num_frames: 400
  resample_rate: 16000
  speed_perturb: False
  num_frms: 150
  aug_prob: 0.6 # prob to add reverb & noise aug per sample
  frontend: "w2vbert_sv"
  w2vbert_sv_args:
    upstream_args:
      name: 'config_baseline.json'
      path_or_url: assets/w2v-bert-2.0
    frozen: True
    frame_shift: 20
    frame_length: 20
  cmvn: False
  cmvn_args:
    norm_mean: False
    norm_var: False
  spec_aug: False
  spec_aug_args:
    num_t_mask: 1
    num_f_mask: 1
    max_t: 10
    max_f: 8
    prob: 0.6

model: SSL_BACKEND_MHFA_LayerNorm
model_init: null
model_args:
  feat_dim: -1  # overridden by frontend.output_size() (=1024) in train.py
  head_nb: 64
  embed_dim: 256
  compression_dim: 128
  feature_grad_mult: 0.0
  nb_layer: 25

projection_args:
  project_type: "arc_margin_intertopk_subcenter" # add_margin, arc_margin, sphere, softmax, arc_margin_intertopk_subcenter
  scale: 32.0
  easy_margin: False

margin_scheduler: MarginScheduler
margin_update:
  initial_margin: 0.0
  final_margin: 0.2
  increase_start_epoch: 3
  fix_start_epoch: 10
  update_margin: True
  increase_type: "exp" # exp, linear

loss: CrossEntropyLoss
loss_args: {}

optimizer: AdamW
optimizer_args:
  weight_decay: 1.0e-7

scheduler: ExponentialDecrease
scheduler_args:
  initial_lr: 1.0e-3
  final_lr: 5.0e-5
  warm_up_epoch: 3
  warm_from_zero: True
