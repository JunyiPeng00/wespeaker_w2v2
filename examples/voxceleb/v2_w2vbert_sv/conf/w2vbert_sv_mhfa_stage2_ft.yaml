### Stage-2 training config: full fine-tuning of W2V-BERT 2.0 + MHFA.
### Ported from the original recipe, with the same two changes as stage-1
### (w2vbert -> w2vbert_sv key rename, absolute path_or_url).
###
### Stage handoff (as in the original recipe):
###   cp <stage1_exp>/models/avg_model.pt <stage2_exp>/models/model_0.pt
###   ... train.py --config this_file --checkpoint <stage2_exp>/models/model_0.pt
###
### frontend_lr_ratio NOTE: the released checkpoints were trained with the 0.1x
### differential frontend lr (frontend lr = 0.1 x backend lr); keep it to reproduce them.

exp_dir: exp/v2_w2vbert_sv/stage2_ft
gpus: "[0,1,2,3,4,5,6,7]"
num_avg: 2
enable_amp: True # whether enable automatic mixed precision training
do_lm: False

seed: 9999
num_epochs: 3
save_epoch_interval: 1 # save model every epoch
log_batch_interval: 100 # log every 100 batchs

dataloader_args:
  batch_size: 48
  num_workers: 8
  pin_memory: False
  prefetch_factor: 8
  drop_last: True

dataset_args:
  # the sample number which will be traversed within one epoch, if the value equals to 0,
  # the utterance number in the dataset will be used as the sample_num_per_epoch.
  sample_num_per_epoch: 0
  shuffle: True
  shuffle_args:
    shuffle_size: 2500
  filter: True
  filter_args:
    min_num_frames: 50
    max_num_frames: 400
  resample_rate: 16000
  speed_perturb: False
  num_frms: 200
  aug_prob: 0.6 # prob to add reverb & noise aug per sample
  frontend: "w2vbert_sv"
  w2vbert_sv_args:
    upstream_args:
      name: 'config_baseline.json'
      path_or_url: assets/w2v-bert-2.0
    frozen: False
    frame_shift: 20
    frame_length: 20
  cmvn: False
  cmvn_args:
    norm_mean: False
    norm_var: False
  spec_aug: False
  spec_aug_args:
    num_t_mask: 1
    num_f_mask: 1
    max_t: 10
    max_f: 8
    prob: 0.6

model: SSL_BACKEND_MHFA_LayerNorm
model_init: null
model_args:
  feat_dim: -1  # overridden by frontend.output_size() (=1024) in train.py
  head_nb: 64
  embed_dim: 256
  compression_dim: 128
  feature_grad_mult: 1.0
  nb_layer: 25

projection_args:
  project_type: "arc_margin_intertopk_subcenter" # add_margin, arc_margin, sphere, softmax, arc_margin_intertopk_subcenter
  scale: 32.0
  easy_margin: False

margin_scheduler: MarginScheduler
margin_update:
  initial_margin: 0.2
  final_margin: 0.3
  increase_start_epoch: 1
  fix_start_epoch: 3
  update_margin: True
  increase_type: "exp" # exp, linear

loss: CrossEntropyLoss
loss_args: {}

optimizer: AdamW
optimizer_args:
  weight_decay: 1.0e-5

scheduler: ExponentialDecrease
scheduler_args:
  initial_lr: 5.0e-4
  final_lr: 1.0e-5
  warm_up_epoch: 1
  warm_from_zero: True
  frontend_modules: ["frontend"]
  frontend_lr_ratio: 0.1  # see NOTE above
